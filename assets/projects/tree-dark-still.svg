<svg xmlns="http://www.w3.org/2000/svg" width="840" height="156.4" viewBox="0 0 840 156.4" role="img" aria-labelledby="title desc">
<title id="title">Tree. Interactive tree-based profiles, built with React.</title>
<desc id="desc">React identity and profile platform built around interactive tree-based profile surfaces. Illustrated workflow preview.</desc>
<style>
.parcel{animation:parcel 7s cubic-bezier(.16,1,.3,1) infinite}
.upload{animation:upload 8s ease-in-out infinite}
.driver-scan{animation:driverScan 6s ease-in-out infinite}
.branch-flow{stroke-dasharray:9 180;animation:branchFlow 8s linear infinite}
.gallery-focus{transform-box:fill-box;transform-origin:center;animation:galleryFocus 9s ease-in-out infinite}
@keyframes parcel{0%,100%{transform:translateX(0)}40%,65%{transform:translateX(15px)}}
@keyframes upload{0%,100%{transform:translate(0,0)}45%,70%{transform:translate(13px,-8px)}}
@keyframes driverScan{0%,100%{transform:translateY(0)}50%{transform:translateY(52px)}}
@keyframes branchFlow{to{stroke-dashoffset:-189}}
@keyframes galleryFocus{0%,100%{transform:scale(1)}40%,65%{transform:scale(1.07)}}

.flow{stroke-dasharray:12 240;animation:flow 7s linear infinite}
.page{animation:page 7s cubic-bezier(.16,1,.3,1) infinite}
.check{stroke-dasharray:28;stroke-dashoffset:0;animation:check 7s ease-out infinite}
.wave{transform-box:fill-box;transform-origin:center;animation:wave 2.8s ease-in-out infinite}
.reply{stroke-dasharray:180;animation:reply 8s ease-out infinite}
.scan{animation:scan 11s linear infinite}
.site{animation:site 14s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-252}}
@keyframes page{0%,100%{transform:translate(0,0)}35%,65%{transform:translate(9px,-5px)}}
@keyframes check{0%,12%{stroke-dashoffset:28}38%,100%{stroke-dashoffset:0}}
@keyframes wave{0%,100%{transform:scaleY(.35)}45%{transform:scaleY(1)}}
@keyframes reply{0%,15%{stroke-dashoffset:180}55%,100%{stroke-dashoffset:0}}
@keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(238px)}}
@keyframes site{0%,100%{transform:translateX(0)}50%{transform:translateX(-6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
